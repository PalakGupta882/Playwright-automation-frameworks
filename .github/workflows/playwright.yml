name: Playwright Tests

on:
  push:
    branches: [ main ]        # run on every push to main
  workflow_dispatch:          # run manually from the Actions tab
  schedule:
    - cron: '0 3 * * *'       # run daily at 3:00 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Create empty session (public tests run logged-out)
        run: echo '{"cookies":[],"origins":[]}' > auth.json

      # Only specs that pass logged out belong here — CI writes an empty
      # session above, so anything login-gated would fail on a real problem
      # it cannot see.
      - name: Run public tests
        run: |
          npx playwright test \
            regression/static-pages.spec.js \
            regression/data-driven-products.spec.js \
            regression/product-search.spec.js \
            regression/product-pricing.spec.js \
            regression/cardless-emi.spec.js \
            --project=chromium

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7